<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1150" viewBox="0 0 1920 1150" preserveAspectRatio="xMidYMid slice">
<title>Soft botanical shadows over a warm textured wellness wall</title>
<desc>Decorative original abstract botanical shadow artwork for Thaissage Center's footer and closing section; no real business premises represented.</desc>
<defs>
<linearGradient id="wall" x1="0" y1="0" x2="1" y2=".45"><stop offset="0" stop-color="#332e29"/><stop offset=".40" stop-color="#56493b"/><stop offset="1" stop-color="#77634d"/></linearGradient>
<radialGradient id="sun" cx="77%" cy="34%" r="72%"><stop offset="0" stop-color="#b49b71" stop-opacity=".65"/><stop offset=".44" stop-color="#a98e6b" stop-opacity=".21"/><stop offset="1" stop-color="#342c27" stop-opacity="0"/></radialGradient>
<radialGradient id="edge" cx="55%" cy="42%" r="79%"><stop offset=".28" stop-color="#0d1510" stop-opacity="0"/><stop offset="1" stop-color="#10140e" stop-opacity=".41"/></radialGradient>
